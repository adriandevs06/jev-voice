<!doctype html>
<meta charset="utf-8">
<title>Claude Voice Console</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #14181d; --line: #232a32;
    --fg: #e6e9ee; --dim: #8b96a5;
    --live: #3ddc84; --think: #f0b429; --speak: #4aa3f0; --off: #6b7480; --hot: #ef5f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  #orb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--off);
    box-shadow: 0 0 0 0 currentColor; flex: none;
  }
  #orb.listening { background: var(--live); animation: pulse 1.3s infinite; color: var(--live); }
  #orb.thinking  { background: var(--think); animation: pulse 1.3s infinite; color: var(--think); }
  #orb.speaking  { background: var(--speak); animation: pulse 1.3s infinite; color: var(--speak); }
  #orb.muted     { background: var(--off); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 currentColor; }
    70%  { box-shadow: 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  #status { font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 600; color: var(--fg); background: #1d232b;
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 18px; cursor: pointer;
  }
  button:hover { background: #252d37; }
  button:disabled { opacity: .4; cursor: default; }
  #mic { min-width: 140px; }
  #mic.live { background: var(--live); border-color: var(--live); color: #06210f; }
  #mic.off  { background: var(--hot); border-color: var(--hot); color: #2b0808; }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { max-width: 760px; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin-bottom: 3px; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .you  { align-self: flex-end; text-align: right; }
  .you .body { background: #1d2732; border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; display: inline-block; text-align: left; }
  .tool .body { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .sys { color: var(--dim); font-size: 13px; font-style: italic; }

  footer {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel);
  }
  #say { flex: 1; font: inherit; color: var(--fg); background: #1a1f26;
         border: 1px solid var(--line); border-radius: 9px; padding: 10px 13px; }
  #say:focus { outline: none; border-color: #3a4654; }
  #usage { padding: 0 20px 10px; color: var(--dim); font-size: 12px;
           font-family: ui-monospace, Consolas, monospace; background: var(--panel); }
</style>

<header>
  <div id="orb" class="muted"></div>
  <div id="status">connecting</div>
  <div class="spacer"></div>
  <button id="stop">Stop speaking</button>
  <button id="mic" class="off">Unmute</button>
</header>

<div id="log"></div>
<div id="usage"></div>

<footer>
  <input id="say" placeholder="…or type it instead" autocomplete="off">
  <button id="send">Send</button>
</footer>

<script>
  const log = document.getElementById('log');
  const orb = document.getElementById('orb');
  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('mic');
  const sayEl = document.getElementById('say');

  let ws, muted = true;

  const LABEL = {
    muted: 'muted', idle: 'ready', listening: 'listening',
    thinking: 'thinking', speaking: 'speaking'
  };

  function add(cls, who, text) {
    const row = document.createElement('div');
    row.className = 'row ' + cls;
    row.innerHTML = '<div class="who"></div><div class="body"></div>';
    row.querySelector('.who').textContent = who;
    row.querySelector('.body').textContent = text;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  let partialRow = null;
  function partial(text) {
    // one live row that rewrites itself while you talk; the final "you" row replaces it
    if (!partialRow) {
      partialRow = document.createElement('div');
      partialRow.className = 'row you';
      partialRow.innerHTML = '<div class="who">hearing</div><div class="body"></div>';
      log.appendChild(partialRow);
    }
    partialRow.querySelector('.body').textContent = text + ' …';
    log.scrollTop = log.scrollHeight;
  }

  function action(r) {
    const what = r.held ? `held (${r.held}): ${r.action}`
               : `${r.ok ? '✓' : '✗'} ${r.action}` +
                 (r.app ? ' ' + r.app : r.url ? ' ' + r.url : r.query ? ' "' + r.query + '"'
                  : r.text ? ' "' + r.text + '"' : r.combo ? ' ' + r.combo : r.window ? ' ' + r.window : '')
               + (r.dry_run ? '  (dry run)' : '') + (r.why ? '  · ' + r.why : '') + (r.error ? '  · ' + r.error : '');
    add('tool', 'did', what);
  }

  function note(text) {
    const d = document.createElement('div');
    d.className = 'row sys';
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function setState(s, isMuted) {
    muted = isMuted;
    // Mic-off and speaking are independent: Claude can still be talking while the
    // mic is muted, so don't let 'muted' mask it.
    const shown = (s === 'speaking') ? 'speaking' : (isMuted ? 'muted' : s);
    orb.className = shown;
    statusEl.textContent = LABEL[shown] || shown;
    micBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    micBtn.className = isMuted ? 'off' : 'live';
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => note('connected');
    ws.onclose = () => { statusEl.textContent = 'disconnected'; orb.className = 'muted'; setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      const { kind, payload } = JSON.parse(ev.data);
      if (kind === 'state')      setState(payload.status, payload.muted);
      else if (kind === 'you')   { if (partialRow) { partialRow.remove(); partialRow = null; } add('you', 'you', payload); }
      else if (kind === 'claude')add('claude', 'claude', payload);
      else if (kind === 'tool')  add('tool', 'tool', '→ ' + payload);
      else if (kind === 'partial') partial(payload);
      else if (kind === 'action') action(payload);
      else if (kind === 'hands') note(payload.hands ? `hands on (${payload.tool_count} windows-mcp tools, ${payload.permission_mode || 'mode ?'})`
                                                    : `hands OFF: ${JSON.stringify(payload.errors || payload.servers)}`);
      else if (kind === 'usage') {
        document.getElementById('usage').textContent =
          `session $${(payload.cost ?? 0).toFixed(4)}  ·  cache created ${payload.cache_created ?? '?'}  ·  cache read ${payload.cache_read ?? '?'}`;
      }
    };
  }

  const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

  micBtn.onclick = () => send({ cmd: muted ? 'unmute' : 'mute' });
  document.getElementById('stop').onclick = () => send({ cmd: 'stop' });

  function submit() {
    const t = sayEl.value.trim();
    if (!t) return;
    send({ cmd: 'say', text: t });
    sayEl.value = '';
  }
  document.getElementById('send').onclick = submit;
  sayEl.onkeydown = (e) => { if (e.key === 'Enter') submit(); };

  // Space toggles the mic, unless you're typing.
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement !== sayEl) {
      e.preventDefault();
      send({ cmd: muted ? 'unmute' : 'mute' });
    }
  });

  connect();
</script>
